[workspace]
resolver = "2"
members = [
	"crates/fast",
	"crates/fast-proto",
	"crates/fast-server",
]

[workspace.package]
license = "MIT"
edition = "2021"
version = "0.0.1"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1

[patch.crates-io]
fast-proto = { path = "crates/fast-proto" }
fast-server = { path = "crates/fast-server" }

[workspace.dependencies]
atoi = "2.0.0"
bytes = "1.7.1"
bincode = "1.3.3"
tracing = "0.1.40"
fast-proto = "0.0.1"
fast-server = "0.0.1"
parking_lot = "0.12.3"
async-stream = "0.3.0"
tokio-stream = "0.1.16"

tokio = { version = "1.40.0", features = ["full"] }
clap = { version = "4.5.17", features = ["derive"] }
serde = { version = "1.0.210", features = ["derive"] }
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
